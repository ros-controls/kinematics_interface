# pre-commit configuration for ROS2 workspace
# See https://pre-commit.com/

repos:
  # -----------------------------
  # Basic sanity checks
  # -----------------------------
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
      - id: check-ast
      - id: check-case-conflict
      - id: check-merge-conflict
      - id: check-symlinks
      - id: check-xml
      - id: check-yaml
      - id: debug-statements
      - id: end-of-file-fixer
      - id: mixed-line-ending
      - id: trailing-whitespace
        exclude_types: [rst]
      - id: fix-byte-order-marker

  # -----------------------------
  # Python (aligned with ROS2 CI)
  # -----------------------------
  - repo: https://github.com/asottile/pyupgrade
    rev: v3.21.2
    hooks:
      - id: pyupgrade
        args: [--py36-plus]

  - repo: https://github.com/psf/black
    rev: 25.12.0
    hooks:
      - id: black
        args: ["--line-length=99"]

  - repo: https://github.com/pycqa/isort
    rev: 5.13.2
    hooks:
      - id: isort
        args: ["--profile=black"]

  - repo: local
    hooks:
      - id: ament_flake8
        name: ament_flake8
        entry: ament_flake8
        language: system
        types: [python]

      - id: ament_pep257
        name: ament_pep257
        entry: ament_pep257
        language: system
        types: [python]

  # -----------------------------
  # C++ (ROS2 standard)
  # -----------------------------
  - repo: local
    hooks:
      - id: ament_uncrustify
        name: ament_uncrustify
        entry: ament_uncrustify --reformat
        language: system
        files: \.(h\+\+|h|hh|hxx|hpp|cuh|c|cc|cpp|cu|c\+\+|cxx|tpp|txx)$
        exclude: ikfast\.h$

      - id: ament_cppcheck
        name: ament_cppcheck
        entry: env AMENT_CPPCHECK_ALLOW_SLOW_VERSIONS=1 ament_cppcheck
        language: system
        files: \.(h\+\+|h|hh|hxx|hpp|cuh|c|cc|cpp|cu|c\+\+|cxx|tpp|txx)$
        exclude: ikfast\.h$

      - id: ament_cpplint
        name: ament_cpplint
        entry: ament_cpplint
        language: system
        files: \.(h\+\+|h|hh|hxx|hpp|cuh|c|cc|cpp|cu|c\+\+|cxx|tpp|txx)$
        args: ["--linelength=100"]
        exclude: ikfast\.h$

  # -----------------------------
  # CMake
  # -----------------------------
  - repo: local
    hooks:
      - id: ament_lint_cmake
        name: ament_lint_cmake
        entry: ament_lint_cmake
        language: system
        files: CMakeLists\.txt$

  # -----------------------------
  # Copyright (ROS2 REQUIRED)
  # -----------------------------
  - repo: local
    hooks:
      - id: ament_copyright
        name: ament_copyright
        entry: ament_copyright
        language: system

  # -----------------------------
  # Documentation
  # -----------------------------
  - repo: https://github.com/PyCQA/doc8
    rev: v2.0.0
    hooks:
      - id: doc8
        args: ['--max-line-length=100', '--ignore=D001']
        exclude: CHANGELOG\.rst$

  - repo: https://github.com/pre-commit/pygrep-hooks
    rev: v1.10.0
    hooks:
      - id: rst-backticks
        exclude: CHANGELOG\.rst$
      - id: rst-directive-colons
      - id: rst-inline-touching-normal

  # -----------------------------
  # Spellcheck
  # -----------------------------
  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.1
    hooks:
      - id: codespell
        args: ['--write-changes']
        exclude: CHANGELOG\.rst|\.(svg|pyc)$

  # -----------------------------
  # GitHub / CI configs
  # -----------------------------
  - repo: https://github.com/python-jsonschema/check-jsonschema
    rev: 0.36.0
    hooks:
      - id: check-github-workflows
        args: ["--verbose"]
      - id: check-github-actions
        args: ["--verbose"]
      - id: check-dependabot
        args: ["--verbose"]
